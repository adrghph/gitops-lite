apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml

helmCharts:
- name: kube-prometheus-stack
  repo: https://prometheus-community.github.io/helm-charts
  version: 78.3.1
  releaseName: kube-prometheus-stack
  namespace: monitoring
  includeCRDs: false
  valuesFile: values.yaml
