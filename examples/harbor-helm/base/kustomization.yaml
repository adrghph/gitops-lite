apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml

helmCharts:
- name: harbor
  repo: https://helm.goharbor.io
  version: 1.18.0
  releaseName: harbor
  namespace: harbor
  includeCRDs: false  # gitops-lite handles CRDs automatically
  valuesFile: values.yaml
